services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://crowdclean:crowdclean@db:5432/crowdclean
      STORAGE_DIR: /app/storage
      MAX_UPLOAD_BYTES: 2147483648
    volumes:
      - crowdclean_uploads:/app/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crowdclean
      POSTGRES_USER: crowdclean
      POSTGRES_PASSWORD: crowdclean
    ports:
      - "5433:5432"
    volumes:
      - crowdclean_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crowdclean -d crowdclean"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  crowdclean_db:
  crowdclean_uploads:
