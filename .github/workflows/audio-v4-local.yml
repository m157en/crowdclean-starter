name: CrowdClean v4 - adaptive hybrid Mac pilot
on:
  push:
    branches: [feature/audio-mvp]
    paths: [".github/audio-v4-request.txt"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crowdclean-v3-mac-local
  cancel-in-progress: false
jobs:
  audio-v4:
    if: github.ref == 'refs/heads/feature/audio-mvp'
    runs-on: [self-hosted, macOS, X64, crowdclean-audio-local]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate isolated audio environment
        shell: bash
        run: |
          set -euo pipefail
          PY="$HOME/.crowdclean-private/venv/bin/python"
          test -x "$PY"
          test -r "$HOME/.crowdclean-private/lost-frequencies.mp3"
          command -v ffmpeg
          "$PY" -c 'import numpy as n, torch, scipy, soundfile, demucs; assert n.__version__.startswith("1."); assert torch.from_numpy(n.array([1.0])).item() == 1'
      - name: Test hybrid processing
        working-directory: backend
        run: |
          "$HOME/.crowdclean-private/venv/bin/python" -m pytest -q tests/test_audio_stems_v4.py tests/test_audio_stems_v3.py tests/test_audio_metrics.py
      - name: Render and measure eight private previews without overwriting
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          PY="$HOME/.crowdclean-private/venv/bin/python"
          OUT="$HOME/Documents/crowdclean-starter/backend/storage/analysis/ab-stems-v4"
          if [ -e "$OUT" ]; then
            test -s "$OUT/report.json" && test -s "$OUT/metrics.json" && test -s "$OUT/listen-v4.html"
            echo "EXISTING_V4_OUTPUT; not overwritten"
          else
            "$PY" -m app.audio_stems_v4 --source "$HOME/.crowdclean-private/lost-frequencies.mp3" --output "$OUT"
          fi
          "$PY" - <<'PY'
          import json
          from pathlib import Path
          folder = Path.home() / "Documents/crowdclean-starter/backend/storage/analysis/ab-stems-v4"
          report = json.loads((folder / "report.json").read_text())
          metrics = json.loads((folder / "metrics.json").read_text())
          assert len(report["items"]) == len(metrics["items"]) == 8
          for item in report["items"]:
              assert (folder / item["preview"]).is_file()
              print(json.dumps({k: v for k, v in item.items() if k in ("episode", "estimated_stem_residual_db", "mean_weights", "weight_min", "weight_max", "residual_gain_min", "residual_gain_max", "clipped_samples_prevented")}))
          for item in metrics["items"]:
              print(json.dumps(item))
          print("LISTENING_REQUIRED:", folder / "listen-v4.html")
          PY
